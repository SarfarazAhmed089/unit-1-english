<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="The Wise Caliph - Class 10th English MCQs Test by Sarfaraz Ahmed">
<title>The Wise Caliph — 20 MCQs | Class 10th</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap');

    :root {
        --bg: #eaf6ff;
        --card: rgba(255, 255, 255, 0.94);
        --card-light: #f5fbff;
        --text: #17324d;
        --muted: #607d95;
        --accent: #2196f3;
        --accent-2: #64b5f6;
        --accent-dark: #1565c0;
        --danger: #ef5350;
        --border: rgba(33, 150, 243, 0.18);
        --shadow: 0 16px 45px rgba(33, 150, 243, 0.12);
    }

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', Arial, sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 8% 8%, rgba(100,181,246,.28), transparent 30%),
            radial-gradient(circle at 92% 12%, rgba(33,150,243,.18), transparent 32%),
            radial-gradient(circle at 50% 100%, rgba(144,202,249,.24), transparent 36%),
            var(--bg);
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(33,150,243,.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(33,150,243,.035) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .container {
        width: min(980px, 94%);
        margin: 0 auto;
        padding: 34px 0 45px;
    }

    /* HERO */
    .hero {
        position: relative;
        overflow: hidden;
        padding: 44px 28px;
        text-align: center;
        border: 1px solid rgba(33,150,243,.18);
        border-radius: 30px;
        background:
            linear-gradient(145deg, rgba(255,255,255,.98), rgba(231,245,255,.96));
        box-shadow: var(--shadow);
        margin-bottom: 24px;
    }

    .hero::before,
    .hero::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(2px);
        opacity: .55;
        pointer-events: none;
    }

    .hero::before {
        width: 230px;
        height: 230px;
        background: rgba(100,181,246,.25);
        top: -125px;
        left: -85px;
    }

    .hero::after {
        width: 260px;
        height: 260px;
        background: rgba(33,150,243,.14);
        right: -115px;
        bottom: -155px;
    }

    .badge {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 15px;
        border-radius: 999px;
        color: #1565c0;
        background: #e3f2fd;
        border: 1px solid #90caf9;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .8px;
        text-transform: uppercase;
    }

    .badge::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(33,150,243,.55);
    }

    h1 {
        position: relative;
        margin: 18px 0 10px;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(34px, 6vw, 58px);
        line-height: 1.08;
        letter-spacing: -.8px;
        color: #123b5d;
    }

    .subtitle {
        position: relative;
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
    }

    .author {
        position: relative;
        display: inline-block;
        margin-top: 17px;
        padding: 9px 15px;
        border-radius: 10px;
        color: #1565c0;
        background: #edf8ff;
        border: 1px solid #c5e4f8;
        font-size: 14px;
        font-weight: 700;
    }

    /* PROGRESS */
    .progress-card {
        position: sticky;
        top: 12px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 13px 16px;
        margin-bottom: 18px;
        border: 1px solid rgba(33,150,243,.18);
        border-radius: 16px;
        background: rgba(255,255,255,.92);
        backdrop-filter: blur(16px);
        box-shadow: 0 10px 28px rgba(33,150,243,.12);
    }

    .progress-text {
        min-width: 120px;
        font-size: 13px;
        color: #4e6d86;
        font-weight: 700;
    }

    .progress-bar {
        height: 9px;
        flex: 1;
        max-width: 500px;
        overflow: hidden;
        border-radius: 999px;
        background: #dceefb;
    }

    .progress-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2196f3, #64b5f6);
        transition: width .3s ease;
    }

    /* QUESTIONS */
    .quiz-card {
        position: relative;
        padding: 25px;
        margin-bottom: 17px;
        border: 1px solid rgba(33,150,243,.16);
        border-radius: 22px;
        background: rgba(255,255,255,.95);
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(33,150,243,.10);
        transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .quiz-card:hover {
        transform: translateY(-2px);
        border-color: rgba(33,150,243,.40);
        box-shadow: 0 14px 34px rgba(33,150,243,.14);
    }

    .question-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
    }

    .question-number {
        color: #1976d2;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .question {
        margin-bottom: 18px;
        font-size: 18px;
        line-height: 1.55;
        font-weight: 800;
        color: #173b59;
    }

    .option {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 15px;
        margin: 10px 0;
        border: 1px solid #d5eaf8;
        border-radius: 13px;
        color: #294b66;
        background: #f7fcff;
        cursor: pointer;
        transition: all .2s ease;
    }

    .option:hover {
        transform: translateX(3px);
        border-color: #64b5f6;
        background: #e8f5ff;
        box-shadow: 0 5px 16px rgba(33,150,243,.08);
    }

    .option input {
        margin-top: 3px;
        accent-color: #2196f3;
        transform: scale(1.08);
        flex-shrink: 0;
    }

    .letter {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 25px;
        height: 25px;
        min-width: 25px;
        border-radius: 7px;
        color: #1976d2;
        background: #e3f2fd;
        font-size: 12px;
        font-weight: 800;
    }

    .correct {
        color: #075e37 !important;
        background: #e8f8ef !important;
        border-color: #55b77a !important;
    }

    .correct .letter {
        color: #ffffff;
        background: #2e9d61;
    }

    .wrong {
        color: #a52b2b !important;
        background: #fff0f0 !important;
        border-color: #ef7774 !important;
    }

    .wrong .letter {
        color: #ffffff;
        background: var(--danger);
    }

    /* BUTTONS */
    .actions {
        text-align: center;
        padding: 15px 0 25px;
    }

    button {
        border: 0;
        border-radius: 13px;
        padding: 14px 24px;
        margin: 5px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
    }

    button:hover {
        transform: translateY(-2px);
    }

    #submitBtn {
        color: #ffffff;
        background: linear-gradient(135deg, #1976d2, #42a5f5);
        box-shadow: 0 10px 25px rgba(33,150,243,.22);
    }

    #resetBtn {
        color: #1565c0;
        background: #ffffff;
        border: 1px solid #b9dcf4;
        box-shadow: 0 8px 20px rgba(33,150,243,.08);
    }

    button:disabled {
        cursor: not-allowed;
        opacity: .5;
    }

    /* RESULT */
    .result {
        display: none;
        text-align: center;
        padding: 34px 24px;
        margin: 10px 0 25px;
        border: 1px solid #90caf9;
        border-radius: 24px;
        background: linear-gradient(145deg, #ffffff, #e7f5ff);
        box-shadow: var(--shadow);
    }

    .result h2 {
        margin: 0;
        font-size: 22px;
        color: #173b59;
    }

    .score {
        margin: 10px 0;
        font-size: clamp(44px, 8vw, 66px);
        font-weight: 800;
        color: #1976d2;
    }

    #message {
        margin: 0;
        color: var(--muted);
        font-weight: 600;
    }

    .footer {
        text-align: center;
        color: #6b879d;
        font-size: 12px;
        padding: 10px 0;
    }

    @media (max-width: 650px) {
        .container {
            width: 92%;
            padding-top: 18px;
        }

        .hero {
            padding: 32px 18px;
            border-radius: 22px;
        }

        .quiz-card {
            padding: 19px;
            border-radius: 18px;
        }

        .question {
            font-size: 16px;
        }

        .progress-card {
            top: 8px;
        }

        .progress-text {
            min-width: 92px;
            font-size: 11px;
        }

        .subtitle {
            font-size: 14px;
        }

        button {
            width: calc(100% - 10px);
        }
    }
</style>
</head>

<body>
<div class="container">

    <header class="hero">
        <div class="badge">Class 10th • English</div>
        <h1>The Wise Caliph</h1>
        <p class="subtitle">20 Multiple Choice Questions</p>
        <div class="author">by Sarfaraz Ahmed · Total 20 Questions</div>
    </header>

    <div class="progress-card">
        <div class="progress-text" id="progressText">0 of 20 answered</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <main id="quiz"></main>

    <div class="actions">
        <button id="submitBtn" onclick="submitQuiz()">✓ Submit Test</button>
        <button id="resetBtn" onclick="resetQuiz()">↻ Reset Test</button>
    </div>

    <section class="result" id="result">
        <h2>Your Final Score</h2>
        <div class="score" id="score">0 / 20</div>
        <p id="message"></p>
    </section>

    <div class="footer">
        The Wise Caliph • Class 10th • English MCQs • Sarfaraz Ahmed
    </div>
</div>

<script>
const quizData = [
    {
        q: "The Caliph was known for his:",
        options: ["Wealth", "Wisdom", "Pride", "Strength"],
        answer: 1
    },
    {
        q: "The Caliph was famous for his:",
        options: ["Justice", "Anger", "Luxury", "Strictness"],
        answer: 0
    },
    {
        q: "The dispute concerned the ownership of a:",
        options: ["Camel", "Horse", "House", "Bag"],
        answer: 1
    },
    {
        q: "The two men appeared before the:",
        options: ["King", "Qazi", "Soldier", "Merchant"],
        answer: 1
    },
    {
        q: "The Qazi could not settle the:",
        options: ["Quarrel", "Dispute", "Journey", "Problem"],
        answer: 1
    },
    {
        q: "The rich man gave the beggar a:",
        options: ["Horse", "Lift", "Gift", "Coin"],
        answer: 1
    },
    {
        q: "The beggar was:",
        options: ["Lame", "Blind", "Deaf", "Sick"],
        answer: 0
    },
    {
        q: "The beggar claimed the horse was:",
        options: ["Stolen", "His", "Sold", "Lost"],
        answer: 1
    },
    {
        q: "The Caliph ordered them to touch the:",
        options: ["Saddle", "Horse", "Bridle", "Cart"],
        answer: 1
    },
    {
        q: "The horse ______ at the beggar's touch.",
        options: ["Neighed", "Winced", "Ran", "Jumped"],
        answer: 1
    },
    {
        q: "The horse reacted with pleasure to the:",
        options: ["Beggar", "Qazi", "Rich man", "Caliph"],
        answer: 2
    },
    {
        q: "The test revealed the horse's true:",
        options: ["Age", "Owner", "Value", "Colour"],
        answer: 1
    },
    {
        q: "The beggar was found to be:",
        options: ["Honest", "Innocent", "Dishonest", "Generous"],
        answer: 2
    },
    {
        q: "The Caliph called the beggar a:",
        options: ["Liar", "Fool", "Coward", "Thief"],
        answer: 0
    },
    {
        q: "The beggar admitted his:",
        options: ["Wealth", "Mistake", "Poverty", "Fear"],
        answer: 1
    },
    {
        q: "The Caliph showed the beggar:",
        options: ["Mercy", "Hatred", "Fear", "Pride"],
        answer: 0
    },
    {
        q: "The rich man forgave the:",
        options: ["Qazi", "Caliph", "Beggar", "Servant"],
        answer: 2
    },
    {
        q: "The rich man was also:",
        options: ["Generous", "Cruel", "Selfish", "Dishonest"],
        answer: 0
    },
    {
        q: "The story mainly highlights:",
        options: ["Wealth", "Justice and wisdom", "War", "Adventure"],
        answer: 1
    },
    {
        q: "The best moral of the story is:",
        options: [
            "Greed brings success.",
            "Truth and justice should prevail.",
            "Wealth is everything.",
            "Power is always right."
        ],
        answer: 1
    }
];

const quiz = document.getElementById("quiz");
const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");

function renderQuiz() {
    quiz.innerHTML = "";

    quizData.forEach((item, index) => {
        const card = document.createElement("section");
        card.className = "quiz-card";

        const top = document.createElement("div");
        top.className = "question-top";
        top.innerHTML = `<span class="question-number">Question ${index + 1}</span>`;

        const question = document.createElement("div");
        question.className = "question";
        question.textContent = item.q;

        card.appendChild(top);
        card.appendChild(question);

        item.options.forEach((option, optionIndex) => {
            const label = document.createElement("label");
            label.className = "option";
            label.dataset.question = index;
            label.dataset.option = optionIndex;

            const letter = String.fromCharCode(65 + optionIndex);

            label.innerHTML = `
                <input type="radio" name="q${index}" value="${optionIndex}">
                <span class="letter">${letter}</span>
                <span>${option}</span>
            `;

            label.querySelector("input").addEventListener("change", updateProgress);
            card.appendChild(label);
        });

        quiz.appendChild(card);
    });

    updateProgress();
}

function updateProgress() {
    const answered = document.querySelectorAll(
        'input[type="radio"]:checked'
    ).length;

    progressText.textContent = `${answered} of ${quizData.length} answered`;
    progressFill.style.width = `${(answered / quizData.length) * 100}%`;
}

function submitQuiz() {
    let score = 0;

    quizData.forEach((item, index) => {
        const selected = document.querySelector(
            `input[name="q${index}"]:checked`
        );

        const labels = document.querySelectorAll(
            `[data-question="${index}"]`
        );

        labels.forEach(label => {
            const optionIndex = Number(label.dataset.option);

            if (optionIndex === item.answer) {
                label.classList.add("correct");
            }
        });

        if (selected) {
            const selectedIndex = Number(selected.value);

            if (selectedIndex === item.answer) {
                score++;
            } else {
                const wrongLabel = document.querySelector(
                    `[data-question="${index}"][data-option="${selectedIndex}"]`
                );

                if (wrongLabel) {
                    wrongLabel.classList.add("wrong");
                }
            }
        }
    });

    const percentage = (score / quizData.length) * 100;

    document.getElementById("score").textContent =
        `${score} / ${quizData.length}`;

    let message = "";

    if (percentage === 100) {
        message = "Outstanding! 🎉 Perfect score. Excellent work!";
    } else if (percentage >= 80) {
        message = "Excellent! 🌟 You have a very strong understanding.";
    } else if (percentage >= 60) {
        message = "Good effort! 📚 Keep practicing to improve your score.";
    } else {
        message = "Keep studying! 💪 Review the lesson and try again.";
    }

    document.getElementById("message").textContent = message;

    const result = document.getElementById("result");
    result.style.display = "block";

    document.querySelectorAll('input[type="radio"]').forEach(input => {
        input.disabled = true;
    });

    document.getElementById("submitBtn").disabled = true;
    result.scrollIntoView({ behavior: "smooth", block: "center" });
}

function resetQuiz() {
    renderQuiz();

    document.getElementById("result").style.display = "none";
    document.getElementById("submitBtn").disabled = false;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

renderQuiz();
</script>
</body>
</html>
